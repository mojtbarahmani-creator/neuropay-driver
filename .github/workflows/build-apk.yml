name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Find Project and Build
        run: |
          echo "=== ساختار فایل‌های شما در گیت‌هاب ==="
          pwd
          ls -la
          find . -maxdepth 3 -not -path '*/.*'
          
          # پیدا کردن محل واقعی فایلی به نام settings.gradle.kts یا پوشه app
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "خطا: فایل settings.gradle.kts پیدا نشد!"
            exit 1
          fi
          
          echo "پروژه در این مسیر پیدا شد: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # اگر پوشه app داخل اینجا نبود، بررسی کن آیا app جای دیگریست
          if [ ! -d "app" ]; then
            echo "هشدار: پوشه app در کنار settings نیست! جستجوی app..."
            find /home/runner/work -name "build.gradle.kts"
          fi
          
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neuropay-driver-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
